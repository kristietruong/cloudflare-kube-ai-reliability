<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kubernetes AI Reliability Copilot</title>
    <style>
      :root {
        --bg: #07111f;
        --panel: #0d1b2a;
        --panel-alt: #12263d;
        --border: rgba(148, 163, 184, 0.25);
        --text: #e2e8f0;
        --muted: #a7b4c5;
        --primary: #38bdf8;
        --success: #22c55e;
        --warning: #fbbf24;
        --danger: #f87171;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, Segoe UI, sans-serif;
        background: linear-gradient(180deg, #020817 0%, #0b1320 100%);
        color: var(--text);
        min-height: 100vh;
      }

      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      .brand {
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .status {
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.82);
        border-radius: 999px;
        padding: 8px 14px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 18px;
        margin-bottom: 24px;
      }

      .card {
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 12px 26px rgba(0,0,0,0.18);
        padding: 18px;
      }

      .card .label {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .card .value {
        font-size: 2rem;
        margin-top: 10px;
        font-weight: 700;
      }

      .layout {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 24px;
      }

      .panel {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px;
      }

      .panel h2 {
        margin-top: 0;
        font-size: 1.1rem;
      }

      .chat-window {
        min-height: 360px;
        max-height: 480px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-bottom: 16px;
      }

      .message {
        max-width: 85%;
        padding: 12px 14px;
        border-radius: 14px;
        line-height: 1.55;
      }

      .message.user {
        align-self: flex-end;
        background: rgba(56, 189, 248, 0.16);
        border: 1px solid rgba(56, 189, 248, 0.32);
      }

      .message.assistant {
        background: rgba(148, 163, 184, 0.08);
        border: 1px solid rgba(148, 163, 184, 0.18);
      }

      .composer {
        display: flex;
        gap: 10px;
      }

      input, button, textarea {
        font: inherit;
      }

      textarea {
        flex: 1;
        min-height: 50px;
        resize: vertical;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        padding: 12px 14px;
      }

      button {
        background: linear-gradient(135deg, var(--primary), #0ea5e9);
        border: none;
        color: #03111c;
        padding: 0 18px;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .incident-summary {
        margin-top: 18px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }

      .severity-pill {
        display: inline-block;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
      }

      .severity-critical { background: rgba(248, 113, 113, 0.12); color: #fecaca; }
      .severity-high { background: rgba(251, 191, 36, 0.12); color: #fcd34d; }
      .severity-medium { background: rgba(56, 189, 248, 0.12); color: #bae6fd; }
      .severity-low { background: rgba(34, 197, 94, 0.12); color: #bbf7d0; }

      .meta-list, .check-list, .command-list {
        list-style: none;
        padding: 0;
        margin: 12px 0 0;
      }

      .meta-list li, .check-list li, .command-list li {
        padding: 8px 0;
        border-bottom: 1px solid rgba(148,163,184,0.12);
      }

      .history-list {
        margin-top: 18px;
        display: grid;
        gap: 10px;
      }

      .history-item {
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.75);
      }

      .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .chip {
        background: rgba(56, 189, 248, 0.09);
        color: var(--text);
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 999px;
        padding: 8px 12px;
        cursor: pointer;
      }

      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">Kubernetes AI Reliability Copilot</div>
        <div class="status">Platform demo • cloudflare workers ai</div>
      </header>

      <section class="cards" id="dashboardCards"></section>

      <section class="layout">
        <div class="panel">
          <h2>AI investigation chat</h2>
          <div id="chatWindow" class="chat-window" aria-live="polite"></div>
          <div class="suggestions" id="suggestions"></div>
          <div class="composer">
            <textarea id="promptInput" placeholder="Ask about CrashLoopBackOff, OOMKilled, node readiness, or failed scheduling..."></textarea>
            <button id="submitButton">Analyze</button>
          </div>
        </div>

        <aside class="panel">
          <h2>Incident details</h2>
          <div id="incidentSummary">
            <p class="muted">Select a diagnosis or submit a new investigation to view it here.</p>
          </div>
        </aside>
      </section>

      <section class="panel" style="margin-top: 24px;">
        <h2>Investigation history</h2>
        <div id="historyList" class="history-list"></div>
      </section>
    </div>

    <script>
      const CARD_TEMPLATE = [
        { label: 'Total investigations', key: 'totalInvestigations' },
        { label: 'Open incidents', key: 'openIncidents' },
        { label: 'Critical incidents', key: 'criticalIncidents' },
        { label: 'Recent issues', key: 'recent' }
      ];

      const suggestions = [
        'Why is my pod in CrashLoopBackOff?',
        'Why did OOMKilled trigger a restart?',
        'What causes ImagePullBackOff?',
        'Why is my node NotReady?'
      ];

      const chatWindow = document.getElementById('chatWindow');
      const dashboardCards = document.getElementById('dashboardCards');
      const historyList = document.getElementById('historyList');
      const incidentSummary = document.getElementById('incidentSummary');
      const promptInput = document.getElementById('promptInput');
      const submitButton = document.getElementById('submitButton');

      function appendMessage(role, text) {
        const bubble = document.createElement('div');
        bubble.className = `message ${role}`;
        bubble.textContent = text;
        chatWindow.appendChild(bubble);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }

      async function loadDashboard() {
        const response = await fetch('/api/dashboard');
        const stats = await response.json();
        dashboardCards.innerHTML = CARD_TEMPLATE.map((card) => {
          const value = card.key === 'recent' ? (stats.recent?.length ?? 0) : stats[card.key];
          return `
            <div class="card">
              <div class="label">${card.label}</div>
              <div class="value">${value}</div>
            </div>
          `;
        }).join('');
      }

      async function loadHistory() {
        const response = await fetch('/api/investigations');
        const data = await response.json();
        const items = data.investigations ?? [];
        historyList.innerHTML = items.length
          ? items.slice(0, 8).map((item) => `
              <div class="history-item">
                <strong>${item.incidentCategory}</strong>
                <div style="color: var(--muted); margin-top: 6px;">${item.affectedResource}</div>
                <div style="margin-top: 8px; color: var(--muted);">${item.summary}</div>
              </div>
            `).join('')
          : '<div class="history-item">No investigations yet.</div>';
      }

      function renderIncidentCard(incident) {
        if (!incident) {
          incidentSummary.innerHTML = '<p class="muted">No incident selected.</p>';
          return;
        }

        const severityClass = `severity-${incident.severity}`;
        incidentSummary.innerHTML = `
          <div class="incident-summary">
            <div><span class="severity-pill ${severityClass}">${incident.severity}</span></div>
            <h3 style="margin: 14px 0 6px;">${incident.incidentCategory}</h3>
            <div style="color: var(--muted);">${incident.affectedResource}</div>
            <h4 style="margin-top: 16px;">Observed symptoms</h4>
            <ul class="check-list">
              ${(incident.observedSymptoms ?? []).map((item) => `<li>${item}</li>`).join('')}
            </ul>
            <h4 style="margin-top: 16px;">Probable root cause</h4>
            <p>${incident.probableRootCause}</p>
            <h4 style="margin-top: 16px;">Supporting evidence</h4>
            <ul class="meta-list">
              ${(incident.supportingEvidence ?? []).map((item) => `<li>${item}</li>`).join('')}
            </ul>
            <h4 style="margin-top: 16px;">Recommended steps</h4>
            <ul class="check-list">
              ${(incident.recommendedTroubleshootingSteps ?? []).map((item) => `<li>${item}</li>`).join('')}
            </ul>
            <h4 style="margin-top: 16px;">kubectl commands</h4>
            <ul class="command-list">
              ${(incident.suggestedKubectlCommands ?? []).map((item) => `<li><code>${item}</code></li>`).join('')}
            </ul>
            <h4 style="margin-top: 16px;">Preventive recommendations</h4>
            <ul class="check-list">
              ${(incident.preventiveRecommendations ?? []).map((item) => `<li>${item}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      function renderSuggestions() {
        const container = document.getElementById('suggestions');
        container.innerHTML = suggestions.map((text) => `<button class="chip" data-prompt="${text}">${text}</button>`).join('');

        container.querySelectorAll('.chip').forEach((button) => {
          button.addEventListener('click', () => {
            promptInput.value = button.dataset.prompt;
            promptInput.focus();
          });
        });
      }

      async function analyzeIncident() {
        const userPrompt = promptInput.value.trim();
        if (!userPrompt) {
          return;
        }

        appendMessage('user', userPrompt);
        promptInput.value = '';

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ userPrompt })
          });

          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || 'Unable to analyze incident.');
          }

          const investigation = payload.investigation;
          const explanation = investigation?.probableRootCause ?? 'No diagnosis returned.';
          appendMessage('assistant', explanation);
          renderIncidentCard(investigation);
          await loadDashboard();
          await loadHistory();
        } catch (error) {
          appendMessage('assistant', error.message || 'The diagnosis failed.');
        }
      }

      submitButton.addEventListener('click', analyzeIncident);
promptInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          analyzeIncident();
        }
      });

      renderSuggestions();
      loadDashboard();
      loadHistory();
      appendMessage('assistant', 'Welcome back. Describe a Kubernetes incident and I will classify the likely root cause and recommended actions.');
    </script>
  </body>
</html>
